<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WOOF.EXE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #11110f;
      color: #f4f0e8;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAV */
    nav {
      width: 100%;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(17,17,15,.92);
      backdrop-filter: blur(12px);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .connect-btn {
      border: 1px solid #b7ff00;
      background: #b7ff00;
      color: #11110f;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .connect-btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    /* HERO */
    .hero {
      width: 100%;
      padding: 35px 5% 20px;
    }

    .hero-banner {
      width: 100%;
      max-width: 1500px;
      margin: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
    }

    /* MAIN */
    main {
      max-width: 1200px;
      margin: auto;
      padding: 55px 5% 90px;
    }

    .title {
      text-align: center;
      font-size: clamp(42px, 8vw, 92px);
      font-weight: 900;
      letter-spacing: -4px;
      line-height: .95;
    }

    .title span {
      color: #b7ff00;
    }

    .description {
      max-width: 650px;
      margin: 25px auto 0;
      text-align: center;
      color: #aaa79e;
      font-size: 17px;
      line-height: 1.6;
    }

    /* MINT */
    .mint-section {
      margin-top: 70px;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 30px;
    }

    .mint-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .mint-card {
      background: #191916;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      padding: 30px;
    }

    .mint-card.free {
      border-color: rgba(183,255,0,.45);
    }

    .mint-card.public {
      border-color: rgba(255,92,132,.45);
    }

    .mint-card h3 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .mint-price {
      font-size: 18px;
      color: #b7ff00;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .public .mint-price {
      color: #ff5c84;
    }

    .mint-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      background: #b7ff00;
      color: #11110f;
    }

    .public .mint-btn {
      background: #ff5c84;
      color: #11110f;
    }

    .mint-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 25px;
      text-align: center;
      min-height: 24px;
      color: #aaa79e;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .wallet-info {
      margin: 18px auto 0;
      text-align: center;
      color: #b7ff00;
      font-size: 13px;
      display: none;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 30px 5%;
      text-align: center;
      color: #77756e;
      font-size: 13px;
    }

    @media(max-width: 700px) {
      nav {
        padding: 14px 4%;
      }

      .nav-title {
        font-size: 14px;
      }

      .connect-btn {
        padding: 10px 13px;
        font-size: 12px;
      }

      .hero {
        padding: 20px 4% 10px;
      }

      main {
        padding: 45px 4% 70px;
      }

      .mint-grid {
        grid-template-columns: 1fr;
      }

      .title {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <div class="nav-left">
      <img
        src="assets/woof-exe-logo.png"
        class="nav-logo"
        alt="WOOF.EXE"
      >

      <div class="nav-title">
        WOOF.EXE
      </div>
    </div>

    <button
      id="connectWallet"
      class="connect-btn"
      type="button"
    >
      Connect Wallet
    </button>
  </nav>


  <!-- HERO -->
  <section class="hero">
    <img
      src="assets/woof-exe-opensea-banner.png"
      class="hero-banner"
      alt="WOOF.EXE"
    >
  </section>


  <!-- CONTENT -->
  <main>

    <h1 class="title">
      WOOF<span>.EXE</span>
    </h1>

    <p class="description">
      999 dogs. One executable. No uninstall button.
      WOOF.EXE is running on Robinhood Chain.
    </p>


    <!-- WALLET STATUS -->
    <div id="walletInfo" class="wallet-info"></div>


    <!-- MINT -->
    <section class="mint-section">

      <h2 class="section-title">
        MINT
      </h2>

      <div class="mint-grid">

        <!-- FREE -->
        <div class="mint-card free">

          <h3>Free Mint</h3>

          <div class="mint-price">
            FREE
          </div>

          <button
            id="freeMintBtn"
            class="mint-btn"
            type="button"
          >
            MINT FREE
          </button>

        </div>


        <!-- PUBLIC -->
        <div class="mint-card public">

          <h3>Public Mint</h3>

          <div class="mint-price">
            0.00015 ETH
          </div>

          <button
            id="publicMintBtn"
            class="mint-btn"
            type="button"
          >
            MINT
          </button>

        </div>

      </div>


      <div
        id="status"
        class="status"
      ></div>

    </section>

  </main>


  <footer>
    WOOF.EXE © 2026
  </footer>


<script type="module">

/* =========================================================
   CONFIG
========================================================= */

const PROJECT_ID =
  "c05be292c5b75162d2ff3f319168f91e";

const CHAIN_ID =
  4663;

const RPC =
  "https://rpc.mainnet.chain.robinhood.com";

const COLLECTION_ADDRESS =
  "0x9590793289f2192a5CDc8F0261917bb17be34d0a";

const COLLECTION_SLUG =
  "woof-exe";

const SCATTER_API =
  "https://api.scatter.art/v1";


/* =========================================================
   ELEMENTS
========================================================= */

const connectButton =
  document.getElementById("connectWallet");

const freeMintButton =
  document.getElementById("freeMintBtn");

const publicMintButton =
  document.getElementById("publicMintBtn");

const statusElement =
  document.getElementById("status");

const walletInfo =
  document.getElementById("walletInfo");


/* =========================================================
   STATE
========================================================= */

let walletProvider = null;
let walletAddress = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

  statusElement.textContent =
    message || "";

}


/* =========================================================
   SHORT ADDRESS
========================================================= */

function shortAddress(address) {

  if (!address) return "";

  return (
    address.slice(0, 6) +
    "..." +
    address.slice(-4)
  );

}


/* =========================================================
   UPDATE WALLET UI
========================================================= */

function updateWalletUI() {

  if (walletAddress) {

    connectButton.textContent =
      shortAddress(walletAddress);

    walletInfo.style.display =
      "block";

    walletInfo.textContent =
      "Connected: " + walletAddress;

  } else {

    connectButton.textContent =
      "Connect Wallet";

    walletInfo.style.display =
      "none";

  }

}


/* =========================================================
   LOAD WALLETCONNECT
========================================================= */

async function loadWalletConnect() {

  if (walletProvider) {
    return walletProvider;
  }

  setStatus(
    "Loading wallet connection..."
  );

  const module =
    await import(
      "https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.25.0/+esm"
    );

  const EthereumProvider =
    module.EthereumProvider;

  if (!EthereumProvider) {

    throw new Error(
      "WalletConnect provider failed to load."
    );

  }


  walletProvider =
    await EthereumProvider.init({

      projectId:
        PROJECT_ID,

      optionalChains: [
        CHAIN_ID
      ],

      rpcMap: {
        [CHAIN_ID]:
          RPC
      },

      showQrModal:
        true,

      qrModalOptions: {
        enableMobileFullScreen:
          true
      },

      metadata: {

        name:
          "WOOF.EXE",

        description:
          "999 dogs. One executable. No uninstall button.",

        url:
          window.location.origin,

        icons: [
          new URL(
            "assets/woof-exe-logo.png",
            window.location.href
          ).href
        ]

      }

    });


  /* EVENTS */

  walletProvider.on(
    "accountsChanged",
    accounts => {

      walletAddress =
        accounts?.[0] || null;

      updateWalletUI();

    }
  );


  walletProvider.on(
    "chainChanged",
    chainId => {

      console.log(
        "Chain changed:",
        chainId
      );

    }
  );


  walletProvider.on(
    "disconnect",
    () => {

      walletAddress =
        null;

      updateWalletUI();

    }
  );


  return walletProvider;

}


/* =========================================================
   CONNECT WALLET
========================================================= */

async function connectWallet() {

  try {

    setStatus(
      "Opening wallet selector..."
    );

    const provider =
      await loadWalletConnect();


    /*
      This opens the WalletConnect
      wallet selection / QR modal.
    */

    await provider.connect();


    const accounts =
      await provider.request({
        method:
          "eth_requestAccounts"
      });


    if (
      !accounts ||
      !accounts.length
    ) {

      throw new Error(
        "No wallet address returned."
      );

    }


    walletAddress =
      accounts[0];


    /* CHECK NETWORK */

    const chainHex =
      await provider.request({
        method:
          "eth_chainId"
      });


    const currentChain =
      parseInt(
        chainHex,
        16
      );


    if (
      currentChain !== CHAIN_ID
    ) {

      setStatus(
        "Please switch your wallet to Robinhood Chain (4663)."
      );

      return;

    }


    updateWalletUI();


    setStatus(
      "Wallet connected."
    );


  } catch (error) {

    console.error(
      "CONNECT ERROR:",
      error
    );

    setStatus(
      error?.message ||
      "Wallet connection failed."
    );

  }

}


/* =========================================================
   GET ELIGIBLE SCATTER MINT LISTS
========================================================= */

async function getEligibleLists() {

  const url =
    `${SCATTER_API}/collection/${COLLECTION_SLUG}/eligible-invite-lists?minterAddress=${walletAddress}`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Failed to load Scatter mint lists."
    );

  }


  const lists =
    await response.json();


  if (!Array.isArray(lists)) {

    throw new Error(
      "Invalid mint list response."
    );

  }


  return lists;

}


/* =========================================================
   FIND MINT LIST
========================================================= */

async function findMintList(type) {

  const lists =
    await getEligibleLists();


  console.log(
    "Scatter lists:",
    lists
  );


  /*
    Look for FREE / freemint first.
  */

  if (type === "free") {

    const freeList =
      lists.find(list => {

        const name =
          String(
            list.name || ""
          ).toLowerCase();

        return (
          name === "freemint" ||
          name.includes("free")
        );

      });


    if (!freeList) {

      throw new Error(
        "Your wallet is not eligible for the Free Mint."
      );

    }


    return freeList;

  }


  /*
    PUBLIC LIST
  */

  const publicList =
    lists.find(list => {

      const name =
        String(
          list.name || ""
        ).toLowerCase();

      return (
        name === "public" ||
        name.includes("public")
      );

    });


  if (!publicList) {

    throw new Error(
      "Public mint list is not available."
    );

  }


  return publicList;

}


/* =========================================================
   GET SCATTER MINT TRANSACTION
========================================================= */

async function getMintTransaction(
  mintList
) {

  const response =
    await fetch(
      `${SCATTER_API}/mint`,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            collectionAddress:
              COLLECTION_ADDRESS,

            chainId:
              CHAIN_ID,

            minterAddress:
              walletAddress,

            lists: [

              {
                id:
                  mintList.id,

                quantity:
                  1
              }

            ]

          })

        }
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    console.error(
      "Scatter mint error:",
      data
    );

    throw new Error(
      data?.message ||
      data?.error ||
      "Scatter mint transaction failed."
    );

  }


  if (
    !data ||
    !data.mintTransaction
  ) {

    throw new Error(
      "Scatter did not return a mint transaction."
    );

  }


  return data;

}


/* =========================================================
   SEND MINT TRANSACTION
========================================================= */

async function sendMintTransaction(
  mintData
) {

  const tx =
    mintData.mintTransaction;


  /*
    Native ETH mint should have
    an empty erc20s array.
  */

  if (
    mintData.erc20s &&
    mintData.erc20s.length > 0
  ) {

    throw new Error(
      "This mint requires ERC20 approval. Native ETH mint expected."
    );

  }


  setStatus(
    "Confirm the mint transaction in your wallet..."
  );


  const txHash =
    await walletProvider.request({

      method:
        "eth_sendTransaction",

      params: [

        {

          from:
            walletAddress,

          to:
            tx.to,

          value:
            tx.value || "0x0",

          data:
            tx.data || "0x"

        }

      ]

    });


  return txHash;

}


/* =========================================================
   MINT
========================================================= */

async function mint(type) {

  try {

    /* CONNECT FIRST */

    if (!walletAddress) {

      await connectWallet();

    }


    if (!walletAddress) {

      return;

    }


    /* CHECK CHAIN */

    const chainHex =
      await walletProvider.request({
        method:
          "eth_chainId"
      });


    const chain =
      parseInt(
        chainHex,
        16
      );


    if (chain !== CHAIN_ID) {

      throw new Error(
        "Wrong network. Please use Robinhood Chain (4663)."
      );

    }


    setStatus(
      "Checking mint eligibility..."
    );


    /* GET LIST */

    const mintList =
      await findMintList(type);


    console.log(
      "Selected mint list:",
      mintList
    );


    setStatus(
      "Preparing mint transaction..."
    );


    /* CREATE TRANSACTION */

    const mintData =
      await getMintTransaction(
        mintList
      );


    console.log(
      "Mint transaction:",
      mintData
    );


    /* SEND */

    const txHash =
      await sendMintTransaction(
        mintData
      );


    setStatus(
      "Mint submitted: " +
      txHash
    );


    console.log(
      "MINT TX:",
      txHash
    );


    /*
      Open Robinhood Chain explorer
    */

    window.open(
      "https://robinhoodchain.blockscout.com/tx/" +
      txHash,
      "_blank"
    );


  } catch (error) {

    console.error(
      "MINT ERROR:",
      error
    );


    setStatus(
      error?.message ||
      "Mint failed."
    );

  }

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

connectButton.addEventListener(
  "click",
  connectWallet
);


freeMintButton.addEventListener(
  "click",
  () => mint("free")
);


publicMintButton.addEventListener(
  "click",
  () => mint("public")
);


/* =========================================================
   INITIAL UI
========================================================= */

setStatus(
  "Connect your wallet to mint."
);

</script>

</body>
</html>
